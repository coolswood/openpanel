name: openpanel
description: OpenPanel analytics for Flutter with native Android and iOS clients, persistent offline event queue and batching.
version: 0.1.1
repository: https://github.com/coolswood/openpanel
topics:
  - analytics

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# The following section is specific to Flutter packages.
flutter:
  plugin:
    platforms:
      android:
        package: dev.coolswood.openpanel
        pluginClass: OpenpanelPlugin
      ios:
        pluginClass: OpenpanelPlugin
